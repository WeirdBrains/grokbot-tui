[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.33.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell", "homebrew", "msi", "pkg"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false
# Releases are started by workflow_dispatch (tag input) instead of a tag push, so
# .github/workflows/auto-release.yml can start one with the default GITHUB_TOKEN
# (tags pushed with GITHUB_TOKEN don't trigger workflows; dispatches do).
dispatch-releases = true
# wix/main.wxs is hand-edited (MSI product/folder named grokbot-tui).
# Keep dist from overwriting it or failing CI because it differs from its template.
allow-dirty = ["msi"]
# Homebrew formula name (same as the Cargo package and the binary).
formula = "grokbot-tui"
# Homebrew tap repo (users run `brew install WeirdBrains/tap/grokbot-tui`). The formula is
# built and attached to every release; it is NOT pushed anywhere unless you add "homebrew"
# to publish-jobs and a HOMEBREW_TAP_TOKEN secret (see PACKAGING.md).
tap = "WeirdBrains/homebrew-tap"
# Extra jobs (reusable workflows in .github/workflows/):
# .deb/.rpm built alongside dist's artifacts, so they are attached to the release.
global-artifacts-jobs = ["./build-linux-packages"]
# AUR PKGBUILD + winget manifests filled in from the real release sha256s.
publish-jobs = ["./publish-manifests"]
# publish-manifests uploads its files to the GitHub release.
github-custom-job-permissions = { "publish-manifests" = { contents = "write" } }

[dist.mac-pkg-config]
# Reverse-DNS bundle identifier for the macOS .pkg.
identifier = "io.github.weirdbrains.grokbot-tui"
install-location = "/usr/local"
