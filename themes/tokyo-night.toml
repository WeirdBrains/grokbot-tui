brand = { fg = "@on_accent", bg = "@accent", bold = true }
top_bar = { fg = "@text", bg = "@header" }
title = { fg = "@accent" }
header_label = { fg = "@subtle" }
account_switch = { fg = "@warn", bold = true, underline = true }
theme_switch = { fg = "@accent", bold = true, underline = true }
mode_active = { fg = "@on_accent", bg = "@accent", bold = true }
mode_inactive = { fg = "@subtle" }
mode_normal = { fg = "@on_accent", bg = "@accent", bold = true }
mode_insert = { fg = "@on_accent", bg = "@ok", bold = true }
mode_command = { fg = "@on_accent", bg = "@warn", bold = true }
mode_visual = { fg = "@on_accent", bg = "@danger", bold = true }
key_hint = { fg = "@muted" }
mouse_on = { fg = "@subtle" }
mouse_off = { fg = "@on_accent", bg = "@warn" }
mock_tag = { fg = "@warn" }
selected = { fg = "@on_accent", bg = "@accent", bold = true }
cursor_row = { reverse = true }
selection = { fg = "@on_accent", bg = "@accent", bold = true }
unread_badge = { fg = "@on_accent", bg = "@warn", bold = true }
reaction_pill = { fg = "@text", bg = "@header" }
menu_bar = { fg = "@text" }
menu_active = { fg = "@on_accent", bg = "@accent", bold = true }
tooltip = { fg = "@modal_text", bg = "@modal_background", border = "@accent" }
toast = { fg = "@modal_text", bg = "@modal_background", border = "@accent" }
toast_warn = { fg = "@on_accent", bg = "@warn", border = "@warn" }
toast_error = { fg = "@on_accent", bg = "@danger", border = "@danger" }
panel_focused = { border = "@accent" }
panel_unfocused = { border = "@subtle" }
chat_panel = {}
muted = { fg = "@muted" }
entry_system = { fg = "@subtle" }
entry_error = { fg = "@danger" }
entry_user = { fg = "@ok" }
entry_bot = { fg = "@accent" }
entry_label_system = { fg = "@subtle", bold = true }
entry_label_error = { fg = "@danger", bold = true }
entry_label_user = { fg = "@ok", bold = true }
entry_label_bot = { fg = "@accent", bold = true }
modal_text = { fg = "@modal_text", bg = "@modal_background" }
help_frame = { border = "@warn" }
help_title = { fg = "@warn", bold = true }
shell_frame_running = { border = "@warn" }
shell_frame_failed = { border = "@danger" }
shell_frame_ok = { border = "@ok" }
shell_title_running = { fg = "@warn", bold = true }
shell_title_failed = { fg = "@danger", bold = true }
shell_title_ok = { fg = "@ok", bold = true }
link_selected = { fg = "@on_accent", bg = "@accent" }
link_unselected = { fg = "@accent", underline = true }
