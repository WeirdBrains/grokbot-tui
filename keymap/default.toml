# grokbot-tui keymap (used when ui.keys = "vim").
# One key, one action, in each table. Reload with /keymap reload.

[global]
"ctrl-q" = "app.quit"
"ctrl-c" = "app.ctrl_c"
"ctrl-shift-c" = "app.ctrl_c_copy"
"ctrl-r" = "input.history_search"
"ctrl-a" = "selection.select_all"
"ctrl-z" = "input.undo_clear"
"f1" = "help.open"
"f6" = "mouse.toggle"
"f7" = "view.toggle_header"
"f8" = "view.toggle_sidebar"
"f9" = "view.toggle_attachments"
"f11" = "card.open"
"f12" = "agents.refresh"

[mode.normal]
"i" = "mode.insert"
"r" = "message.react"
"c" = "card.open"
"shift-r" = "message.react_picker"
"o" = "message.open"
"d" = "message.download"
"shift-o" = "image.view"
"x" = "message.open_other"
"b" = "browser.open"
"a" = "mode.insert_end"
"v" = "mode.visual"
":" = "mode.command"
"h" = "move.left"
"j" = "move.down"
"k" = "move.up"
"l" = "move.right"
"g" = "move.top"
"shift-g" = "move.bottom"
"tab" = "focus.next"
"shift-tab" = "focus.prev"
"ctrl-w" = "focus.next"
"p" = "input.paste"
"/" = "input.history_search"

[mode.insert]
"esc" = "mode.normal"
"ctrl-r" = "input.history_search"
"ctrl-j" = "input.newline"
"alt-enter" = "input.newline"
"shift-enter" = "input.newline"
"ctrl-enter" = "input.newline"

[mode.command]
"esc" = "mode.normal"
"enter" = "command.run"
"tab" = "command.complete"

[mode.visual]
"esc" = "mode.normal"
"h" = "move.left"
"j" = "move.down"
"k" = "move.up"
"l" = "move.right"
"y" = "selection.copy"
"d" = "selection.clear"
