[package]
name = "gb"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Terminal UI for Grok Bot"
readme = "../../README.md"
keywords = ["grok", "tui", "chat", "terminal"]
categories = ["command-line-utilities"]

[package.metadata.wix]
upgrade-guid = "49193C36-7DFF-424F-AC0D-1247767E9970"
path-guid = "D7774F8D-69B3-4386-B1DE-FB956F917C8C"
license = false
eula = false


# --- Linux packages (built in CI by .github/workflows/build-linux-packages.yml) ---
[package.metadata.deb]
name = "grokbot-tui"
maintainer = "Michael Christenson II <m3talsmith@gmail.com>"
section = "utils"
priority = "optional"
extended-description = """\
A terminal user interface for Grok Bot: chat with your bots, switch accounts, \
and keep a local SQLite history. Unofficial; uses the Grok Bot gateway API."""
depends = "$auto"
# DEP-5 copyright file (full BSD-3-Clause text) -> /usr/share/doc/grokbot-tui/copyright.
license-file = ["../../packaging/deb/copyright", "0"]
assets = [
    ["target/release/grokbot-tui", "usr/bin/", "755"],
    ["../../README.md", "usr/share/doc/grokbot-tui/README.md", "644"],
]

[package.metadata.generate-rpm]
name = "grokbot-tui"
summary = "Terminal UI for Grok Bot"
assets = [
    { source = "target/release/grokbot-tui", dest = "/usr/bin/grokbot-tui", mode = "755" },
    { source = "../../README.md", dest = "/usr/share/doc/grokbot-tui/README.md", mode = "644", doc = true },
    { source = "../../LICENSE", dest = "/usr/share/licenses/grokbot-tui/LICENSE", mode = "644", doc = true },
]

[[bin]]
name = "grokbot-tui"
path = "src/main.rs"

[dependencies]
grokbot_api = { path = "../grokbot_api", features = ["desktop-session"] }
ratatui = { version = "0.29", features = ["unstable-rendered-line-info"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
clap = { version = "4", features = ["derive", "env"] }
dirs = "6"
async-trait = "0.1"
anyhow = "1"
unicode-width = "0.2"
rusqlite = { version = "0.37", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
