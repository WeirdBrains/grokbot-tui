[package]
name = "gb"
version.workspace = true
edition.workspace = true
description = "Terminal UI for Grok Bot"

[[bin]]
name = "grokbot-tui"
path = "src/main.rs"

[dependencies]
grokbot_api = { path = "../grokbot_api", features = ["desktop-session"] }
ratatui = "0.29"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
clap = { version = "4", features = ["derive", "env"] }
dirs = "6"
async-trait = "0.1"
anyhow = "1"
rusqlite = { version = "0.37", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
