[package]
name = "grokbot-tui"
version = "1.30.0"
edition = "2024"
rust-version = "1.89"
license = "GPL-3.0-or-later"
authors = ["Michael Christenson II <m3talsmith@gmail.com>"]
homepage = "https://github.com/WeirdBrains/grokbot-tui"
repository = "https://github.com/WeirdBrains/grokbot-tui"
description = "Terminal UI for Grok Bot"
readme = "README.md"
keywords = ["grok", "tui", "chat", "terminal"]
categories = ["command-line-utilities"]

[package.metadata.wix]
upgrade-guid = "49193C36-7DFF-424F-AC0D-1247767E9970"
path-guid = "D7774F8D-69B3-4386-B1DE-FB956F917C8C"
license = false
eula = false


# --- Linux packages (built in CI by .github/workflows/build-linux-packages.yml) ---
[package.metadata.deb]
name = "grokbot-tui"
maintainer = "Michael Christenson II <m3talsmith@gmail.com>"
section = "utils"
priority = "optional"
extended-description = """\
A terminal user interface for Grok Bot: chat with your bots, switch accounts, \
and keep a local SQLite history. Unofficial; uses the Grok Bot gateway API."""
depends = "$auto"
# DEP-5 copyright file (GPL-3.0-or-later) -> /usr/share/doc/grokbot-tui/copyright.
license-file = ["packaging/deb/copyright", "0"]
assets = [
    ["target/release/grokbot-tui", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/grokbot-tui/README.md", "644"],
    ["THIRD_PARTY.md", "usr/share/doc/grokbot-tui/THIRD_PARTY.md", "644"],
]

[package.metadata.generate-rpm]
name = "grokbot-tui"
summary = "Terminal UI for Grok Bot"
assets = [
    { source = "target/release/grokbot-tui", dest = "/usr/bin/grokbot-tui", mode = "755" },
    { source = "README.md", dest = "/usr/share/doc/grokbot-tui/README.md", mode = "644", doc = true },
    { source = "LICENSE", dest = "/usr/share/licenses/grokbot-tui/LICENSE", mode = "644", doc = true },
    { source = "THIRD_PARTY.md", dest = "/usr/share/doc/grokbot-tui/THIRD_PARTY.md", mode = "644", doc = true },
]

[[bin]]
name = "grokbot-tui"
path = "src/main.rs"

[dependencies]
grokbot_api = { version = "1.2", features = ["desktop-session"] }
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
ratatui-lipgloss = "1.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "process", "fs", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
clap = { version = "4", features = ["derive", "env"] }
dirs = "6"
async-trait = "0.1"
anyhow = "1"
unicode-width = "0.2"
rusqlite = { version = "0.37", features = ["bundled"] }
tui-big-text = "0.8"
toml = "0.9"
# Already in the tree via grokbot_api (same version and TLS backend): downloading the
# shipped default theme when no theme files are installed.
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
emojis = "0.9.1"
unicode-segmentation = "1.13.3"
pulldown-cmark = { version = "0.13.5", default-features = false }
ratatui-image = { version = "11.1", default-features = false, features = ["crossterm"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
html2text = "0.17"
url = "2"
openh264 = "0.9"
mp4 = "0.14"
rodio = { version = "0.23", default-features = false, features = ["flac", "mp3", "mp4", "playback", "vorbis", "wav"] }
# The -ffmpeg builds (GPL): FFmpeg linked in for every codec. See THIRD_PARTY.md.
ffmpeg-next = { version = "9", optional = true, default-features = false, features = ["codec", "format", "software-scaling", "software-resampling"] }

[target."cfg(unix)".dependencies]
# Terminal background query (OSC 11) for the "system" theme mode.
libc = "0.2"


[dev-dependencies]
tempfile = "3"
wiremock = "0.6"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[features]
# Link FFmpeg (found via pkg-config, or vcpkg on Windows).
ffmpeg = ["dep:ffmpeg-next"]
# Build FFmpeg from source and link it statically (Linux/macOS -ffmpeg release builds).
ffmpeg-static = ["ffmpeg", "ffmpeg-next/build", "ffmpeg-next/static"]
