[package]
name = "gb"
version = "0.1.0"
edition = "2024"
description = "Terminal UI for Grok Bot"

[[bin]]
name = "gb"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
dirs = "6"
async-trait = "0.1"
anyhow = "1"

[dev-dependencies]
tempfile = "3"
