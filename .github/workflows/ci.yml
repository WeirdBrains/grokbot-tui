# Format, lint and test. Runs on pull requests and on pushes to branches other than
# main; pushes to main (and version tags) run it through auto-release.yml, which only
# releases when these checks pass.
name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - main
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - name: System libraries (ALSA for audio)
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config
      - name: Format
        run: cargo fmt --check
      # Default features; the -ffmpeg feature is linted in build-ffmpeg-variant.yml
      # (it compiles FFmpeg from source).
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Release build
        run: cargo build --locked --release
