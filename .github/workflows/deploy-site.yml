name: Deploy website to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install site deps
        run: python -m pip install --upgrade pip markdown
      - name: Build site (custom domain)
        env:
          CUSTOM_DOMAIN: tui.grokbot.weirdbrains.com
        run: |
          mkdir -p site
          echo "$CUSTOM_DOMAIN" > site/CNAME
          python3 site/build.py --base /
          python3 site/check.py --base /
          ls -l target/site
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: target/site
          publish_branch: gh-pages
          force_orphan: true
