name: Build Arch packages

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build Arch packages for (e.g. v1.41.6)
        required: true
        type: string

permissions:
  contents: write

jobs:
  # workflow_dispatch has no cargo-dist plan; synthesize the two fields the
  # package job reads. workflow_call keeps using inputs.plan directly so the
  # large dist manifest is never stuffed through a job output.
  prepare-plan:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    outputs:
      plan: ${{ steps.set.outputs.plan }}
    steps:
      - id: set
        shell: bash
        run: |
          TAG="${{ inputs.tag }}"
          if [[ ! "$TAG" =~ ^v[0-9] ]]; then
            echo "tag must look like v1.2.3, got: $TAG" >&2
            exit 1
          fi
          VERSION="${TAG#v}"
          delimiter="PLAN_$(openssl rand -hex 8)"
          {
            echo "plan<<$delimiter"
            jq -nc --arg tag "$TAG" --arg version "$VERSION" \
              '{announcement_tag:$tag, releases:[{app_name:"grokbot-tui", app_version:$version}]}'
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

  arch-packages:
    needs: [prepare-plan]
    if: ${{ always() && !cancelled() && (github.event_name != 'workflow_dispatch' || needs.prepare-plan.result == 'success') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
            container: archlinux:base-devel
          - arch: aarch64
            # Official archlinux images are amd64-only. archlinuxarm/archlinuxarm
            # is not publicly pullable (denied on GH-hosted ARM runners).
            # menci/archlinuxarm is a maintained multi-arch image (daily builds,
            # including linux/arm64) with a base-devel tag matching official Arch.
            runner: ubuntu-22.04-arm
            container: menci/archlinuxarm:base-devel
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PLAN: ${{ github.event_name == 'workflow_dispatch' && needs.prepare-plan.outputs.plan || inputs.plan }}
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # archlinux:base-devel (and the ARM image) do not ship jq. Install tooling
      # before any step that parses the dist plan.
      - name: Install tooling (pacman)
        shell: bash
        run: |
          # pacman 7+ sandboxes downloads with Landlock. GitHub's container
          # runtime rejects that ("Operation not permitted" / "switching to
          # sandbox user 'alpm' failed"), which is typical on the ARM image.
          if pacman --help 2>&1 | grep -q -- '--disable-sandbox' \
             && ! grep -q '^DisableSandbox' /etc/pacman.conf; then
            printf '\n# Required in GitHub Actions containers (Landlock is blocked).\nDisableSandbox\n' >> /etc/pacman.conf
          fi
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed git curl jq binutils fakeroot base-devel namcap gnupg github-cli

      - name: Read tag and version from the dist plan
        id: plan
        shell: bash
        run: |
          tag=$(jq -r '.announcement_tag' <<<"$PLAN")
          version=$(jq -r '.releases[] | select(.app_name == "grokbot-tui") | .app_version' <<<"$PLAN")
          [[ -n $tag && $tag != null && -n $version && $version != null ]]
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Download checksums and source tarball from the release
        env:
          TAG: ${{ steps.plan.outputs.tag }}
        shell: bash
        run: |
          mkdir -p checksums
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" -p '*.sha256' -D checksums
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" -p 'source.tar.gz' -D .
          echo "$(awk '{print $1}' checksums/source.tar.gz.sha256)  source.tar.gz" | sha256sum -c -

      - name: Render AUR PKGBUILDs from release (for packaging)
        id: render
        env:
          TAG: ${{ steps.plan.outputs.tag }}
          VERSION: ${{ steps.plan.outputs.version }}
        shell: bash
        run: |
          # Don't use tar | head under pipefail: head closes the pipe and tar
          # exits 141, failing the step.
          srcdir=$(set +o pipefail; tar -tzf source.tar.gz | head -1 | cut -d/ -f1)
          bash packaging/render-manifests.sh "$TAG" "$VERSION" checksums "$srcdir" out
          ls -lR out/aur

      - name: Build grokbot-tui-bin (${{ matrix.arch }})
        working-directory: out/aur/grokbot-tui-bin
        shell: bash
        run: |
          useradd -m builder || true
          chown -R builder .
          # Preinstall runtime deps to avoid makepkg needing sudo
          pacman -S --noconfirm --needed glibc gcc-libs alsa-lib
          su builder -c 'makepkg --clean --force --noconfirm'
          ls -l *.pkg.tar.zst
          for f in *.pkg.tar.zst; do
            sha256sum "$f" > "$f.sha256"
          done

      - name: Import GPG key (if configured)
        id: import
        if: env.GPG_PRIVATE_KEY != ''
        shell: bash
        run: |
          echo "::notice::Importing GPG private key from repository secret GPG_PRIVATE_KEY"
          # Import armored key from the job env (mapped from the secret); do not echo contents.
          printf '%s\n' "$GPG_PRIVATE_KEY" > "$RUNNER_TEMP/release.key"
          gpg --batch --import "$RUNNER_TEMP/release.key"
          rm -f "$RUNNER_TEMP/release.key"
          gpg --list-secret-keys || true

      - name: Sign packages (.asc) (if key configured)
        if: env.GPG_PRIVATE_KEY != ''
        working-directory: out/aur/grokbot-tui-bin
        env:
          PASSPHRASE: ${{ env.GPG_PASSPHRASE }}
        shell: bash
        run: |
          for f in *.pkg.tar.zst; do
            [ -f "$f" ] || continue
            if [ -n "${PASSPHRASE:-}" ]; then
              gpg --pinentry-mode loopback --passphrase "$PASSPHRASE" --armor --detach-sign --batch --yes --output "$f.asc" "$f"
            else
              gpg --pinentry-mode loopback --armor --detach-sign --batch --yes --output "$f.asc" "$f"
            fi
          done
          ls -l

      - name: Upload packages to the GitHub Release
        env:
          TAG: ${{ steps.plan.outputs.tag }}
        working-directory: out/aur/grokbot-tui-bin
        shell: bash
        run: |
          shopt -s nullglob
          files=(*.pkg.tar.zst *.pkg.tar.zst.sha256 *.pkg.tar.zst.asc)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no Arch packages to upload" >&2
            exit 1
          fi
          # --clobber replaces only these filenames; other release assets are left alone.
          gh release upload "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber

      - name: Upload as workflow artifacts too
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-arch-packages-${{ matrix.arch }}
          path: out/aur/grokbot-tui-bin/*.pkg.tar.zst*
